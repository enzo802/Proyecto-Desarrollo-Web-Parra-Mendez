<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="icon" type="image/png" href="images/logo-removebg-preview.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lilita+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/login.css">
</head>

<body>

  <!-- Capa invisible de 5x5 zonas: detecta dónde está el cursor -->
  <div class="zonas" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="wrap">

    <div class="logo-container">
      <img src="images/logo_con_nombre.jfif" alt="Logo" class="logo">
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>
      <p class="subtitle">Ingresá tus datos para continuar</p>

      <form>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Mail@gmail.com"
                 autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Contraseña"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5-5.7"/>
                <path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/>
                <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/>
                <path d="M2 2l20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox">
            Recordarme
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <p class="signup">¿No tenés cuenta? <a href="#" class="link">Registrate</a></p>
    </section>

    <!-- Mascota (derecha): los ojos siguen al cursor -->
    <div class="stage">
      <div class="mascot" role="img" aria-label="PopScore, la mascota de pochoclos">
        <img src="images/logo-ojos-vacios.png" alt="" class="mascot-img" draggable="false">

        <div class="eye eye-left" aria-hidden="true">
          <span class="pupil"></span>
        </div>
        <div class="eye eye-right" aria-hidden="true">
          <span class="pupil"></span>
        </div>
      </div>
      <p class="wordmark">PopScore</p>
    </div>

  </main>

  <script>
    document.addEventListener('mousemove', (event) => {
      const eyes = document.querySelectorAll('.eye');

      eyes.forEach(eye => {
        const pupil = eye.querySelector('.pupil');
        if (!pupil) return;

        // Obtener las dimensiones y posición del ojo en la pantalla
        const rect = eye.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width / 2;
        const eyeCenterY = rect.top + rect.height / 2;

        // Calcular la diferencia entre el cursor y el centro del ojo
        const deltaX = event.clientX - eyeCenterX;
        const deltaY = event.clientY - eyeCenterY;

        // Calcular el ángulo y la distancia lineal
        const angle = Math.atan2(deltaY, deltaX);
        const distance = Math.hypot(deltaX, deltaY);

        // Definir el límite de movimiento para que la pupila no salga del globo ocular
        const maxRadiusX = rect.width * 0.17; 
        const maxRadiusY = rect.height * 0.17;

        // Escalar la intensidad del movimiento (400px de distancia = movimiento máximo)
        const distanceScale = Math.min(distance / 400, 1);

        // Calcular las nuevas coordenadas X e Y
        const moveX = Math.cos(angle) * maxRadiusX * distanceScale;
        const moveY = Math.sin(angle) * maxRadiusY * distanceScale;

        // Inyectar los valores en las variables CSS del elemento pupila
        pupil.style.setProperty('--dx', `${moveX}px`);
        pupil.style.setProperty('--dy', `${moveY}px`);
      });
    });</script>
</body>

</html>
