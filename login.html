<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="icon" type="image/png" href="images/logo-removebg-preview.png">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>

  <div class="wrap">

    <div class="logo-container">
      <img src="images/logo_con_nombre.jfif" alt="Logo" class="logo">
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>
      <p class="subtitle">Ingresá tus datos para continuar</p>

      <form>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Mail@gmail.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox">
            Recordarme
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <p class="signup">¿No tenés cuenta? <a href="#" class="link">Registrate</a></p>
    </div>

  </div>

</body>

</html>
