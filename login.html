<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - Reseñas</title>
<style>
  :root {
    --deep-twilight: #000045;
    --electric-sapphire: #6670FB;
    --sunflower-gold: #F4B942;
    --dusty-grape: #4B4E78;
    --input-bg: #363a66;
    --khaki-beige: #B8A88A;
    --ghost-white: #F7F7FC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--deep-twilight);
    color: var(--ghost-white);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 380px;
  }

  .login-card {
    background: var(--dusty-grape);
    border-radius: 20px;
    padding: 30px 26px;
  }

  .login-card h2 {
    margin: 0 0 6px;
    font-size: 1.3rem;
    font-weight: 800;
  }

  .subtitle {
    margin: 0 0 24px;
    color: var(--khaki-beige);
    font-size: 0.85rem;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--khaki-beige);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ghost-white);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input::placeholder { color: #9a9dc4; }
  .field input:focus { border-color: var(--electric-sapphire); }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.8rem;
    color: var(--khaki-beige);
  }
  .remember input { accent-color: var(--electric-sapphire); }

  .link {
    color: var(--sunflower-gold);
    font-size: 0.8rem;
    font-weight: 700;
    text-decoration: none;
  }
  .link:hover { text-decoration: underline; }

  .btn-primary {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--electric-sapphire);
    color: var(--ghost-white);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.9; }

  .signup {
    text-align: center;
    margin-top: 22px;
    font-size: 0.83rem;
    color: var(--khaki-beige);
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Ingresá tus datos para continuar</p>

    <form>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox">
          Recordarme
        </label>
        <a href="#" class="link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <p class="signup">¿No tenés cuenta? <a href="#" class="link">Registrate</a></p>
  </div>

</div>

</body>
</html>
