<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio | PopScore</title>
  <link rel="stylesheet" href="../styles/home.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="marca">
        <a href="home.html">
          <img src="../images/nombre.png" alt="PopScore" class="logo-marca" />
        </a>
      </div>

      <nav class="nav-principal" aria-label="Navegación principal">
        <ul>
          <li><a href="home.html" class="activo">Inicio</a></li>
          <li><a href="reseñas.html">Reseñas</a></li>
        </ul>
      </nav>

      <div class="nav-secundaria">
        <a href="config.html">Configuración</a>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </aside>

    <main class="contenido-principal">
      <div class="header">
        <h1>INICIO</h1>
        <div class="buscador-wrapper">
          <svg class="buscador-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="input-buscar" class="buscador-input" placeholder="Buscar película por título..." autocomplete="off">
        </div>
      </div>

      <section class="seccion-populares">
        <h2>POPULARES</h2>
        <div class="grilla-peliculas">
          <!-- Las películas se cargan dinámicamente vía TMDB API -->
        </div>
      </section>
    </main>
  </div>

  <!-- Modal de Detalle de Película, Dónde Ver Legalmente y Tráiler -->
  <div id="modal-pelicula" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-contenido">
      
      <div class="modal-header">
        <div class="modal-pelicula-info">
          <img id="modal-poster" class="modal-poster-img" src="" alt="Póster">
          <div class="modal-titulo-wrap">
            <h2 id="modal-titulo">Cargando...</h2>
            <p id="modal-metadatos" class="modal-subtitulo-info">Año • Género</p>
            <p id="modal-puntuacion" class="puntuacion">★ 0.0</p>
          </div>
        </div>
        <button type="button" id="btn-cerrar-modal" class="modal-cerrar" onclick="cerrarModalPelicula()" aria-label="Cerrar modal">&times;</button>
      </div>

      <p id="modal-sinopsis" class="modal-sinopsis">Cargando información de la película...</p>

      <!-- Botón para ver tráiler (no se reproduce por defecto) -->
      <div class="modal-trailer-seccion">
        <button type="button" id="btn-ver-trailer" class="btn-ver-trailer" onclick="alternarTrailer()">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
          <span id="texto-btn-trailer">Ver Tráiler</span>
        </button>
        <div id="contenedor-video-trailer" class="contenedor-video-trailer" style="display: none;">
          <!-- Iframe de YouTube inyectado al hacer clic en el botón -->
        </div>
      </div>

      <!-- Dónde ver legalmente -->
      <section class="seccion-donde-ver">
        <div class="donde-ver-header">
          <h3>DISPONIBLE EN PLATAFORMAS LEGALES</h3>
          <span class="powered-by-justwatch">Vía JustWatch / TMDB</span>
        </div>
        <div id="lista-donde-ver" class="lista-donde-ver">
          <!-- Cargado dinámicamente -->
        </div>
      </section>

    </div>
  </div>

  <script src="../JavaScript/TMDB.js"></script>
</body>

</html>
