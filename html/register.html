<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="icon" type="image/png" href="../images/logo-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lilita+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <main class="wrap">
        <div class="login-card">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Completá tus datos para registrarte</p>

            <form id="register-form">
                <div class="field">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Mail@gmail.com" autocomplete="email"
                        required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password" minlength="6" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5-5.7" />
                                <path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2" />
                                <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2" />
                                <path d="M2 2l20 20" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="password2">Repetir contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password2" name="password2" placeholder="Repetí la contraseña"
                            autocomplete="new-password" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5-5.7" />
                                <path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2" />
                                <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2" />
                                <path d="M2 2l20 20" />
                            </svg>
                        </button>
                    </div>
                </div>

                <p class="form-error" id="form-error" role="alert"></p>
                <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>

            <p class="signup">¿Ya tenés cuenta? <a href="login.html" class="link">Iniciá sesión</a></p>
        </div>

        <div class="stage">
            <div class="mascot" role="img" aria-label="PopScore, la mascota de pochoclos">
                <img src="../images/logo-ojos-vacios.png" alt="" class="mascot-img" draggable="false">
                <div class="eye eye-left" aria-hidden="true"><span class="pupil"></span></div>
                <div class="eye eye-right" aria-hidden="true"><span class="pupil"></span></div>
            </div>
            <p class="wordmark">PopScore</p>
        </div>
    </main>

    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/login.js"></script>
    <script src="../JavaScript/register.js"></script>
</body>

</html>
