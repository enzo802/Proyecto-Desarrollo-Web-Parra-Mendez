<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <!-- ícono de la pestaña -->
  <link rel="icon" type="image/png" href="../images/logo-removebg-preview.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lilita+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

  <!-- capa invisible de 5x5 para saber donde está el mouse -->
  <div class="zonas" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="wrap">

    <!-- tarjeta a la izquierda -->
    <div class="login-card">
      <h2>Iniciar sesión</h2>
      <p class="subtitle">Ingresá tus datos para continuar</p>

      <form>
        <!-- mail -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Mail@gmail.com"
                 autocomplete="email" required>
        </div>

        <!-- contraseña + botón del ojito para mostrarla/ocultarla -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Contraseña"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">
              <!-- ojo abierto -->
              <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- ojo tachado (el css/js alterna entre los dos) -->
              <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5-5.7"/>
                <path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/>
                <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/>
                <path d="M2 2l20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- recordarme y olvidé contraseña -->
        <div class="row-between">
          <label class="remember">
            <input type="checkbox">
            Recordarme
          </label>
          <!-- TODO: link real -->
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <!-- registro (todavía no existe la página) -->
      <p class="signup">¿No tenés cuenta? <a href="#" class="link">Registrate</a></p>
    </div>

    <!-- mascota a la derecha -->
    <div class="stage">
      <div class="mascot" role="img" aria-label="PopScore, la mascota de pochoclos">

        <img src="../images/logo-ojos-vacios.png" alt="" class="mascot-img" draggable="false">

        <!-- los ojos van aparte para poder mover las pupilas con js -->
        <div class="eye eye-left" aria-hidden="true">
          <span class="pupil"></span>
        </div>
        <div class="eye eye-right" aria-hidden="true">
          <span class="pupil"></span>
        </div>
      </div>
      <p class="wordmark">PopScore</p>
    </div>

  </main>

  <!-- logo.js: mueve las pupilas y el ojito de la contraseña -->
  <script src="../JavaScript/logo.js"></script>
</body>

</html>
