<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e22;
            --hero-bg: #40447a;
            --card-bg: #1c2044;
            --placeholder-bg: #5c6193;
            --placeholder-line: #d9a35f;
            --accent: #f0a934;
            --btn: #6f74ef;
            --text: #ffffff;
            --text-muted: #b7bade;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
        }

        h1,
        h2,
        h3,
        h4 {
            margin: 0;
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* BARRA DE NAVEGACIÓN Y CATEGORÍAS */
        .nav-categories {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .nav-categories::-webkit-scrollbar {
            display: none; /* Oculta scrollbar en navegadores WebKit */
        }

        .category-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-link:hover {
            color: var(--text);
            background: var(--hero-bg);
        }

        .category-link.active {
            color: var(--text);
            background: var(--btn);
        }

        /* placeholder icon, used for movie thumbnails */
        .thumb {
            background: var(--placeholder-bg);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .thumb svg {
            width: 55%;
            height: 55%;
        }

        .rating {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .rating svg {
            width: 13px;
            height: 13px;
        }

        /* buttons */
        .btn {
            border: none;
            border-radius: 10px;
            background: var(--btn);
            color: var(--text);
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            padding: 10px 24px;
            font-size: 0.85rem;
        }

        .btn-secondary {
            padding: 7px 16px;
            font-size: 0.75rem;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* hero / featured section */
        .hero {
            margin-bottom: 34px;
            border-radius: 22px;
        }

        .hero-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .hero-card {
            background: var(--hero-bg);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hero-card .thumb {
            width: 46%;
            aspect-ratio: 1 / 1;
        }

        .badge {
            display: inline-block;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            margin-bottom: 6px;
        }

        .hero-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        /* popular section */
        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .popular-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .popular-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .popular-item .thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
        }

        .popular-info {
            flex: 1;
            min-width: 0;
        }

        .popular-info h4 {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .grid-only {
            display: none;
        }

        /* wide-screen layout */
        @media (min-width: 860px) {
            .hero {
                background: var(--hero-bg);
                padding: 26px 30px;
            }

            .hero-title {
                margin-bottom: 22px;
            }

            .hero-card {
                background: transparent;
                padding: 0;
                flex-direction: row;
                align-items: center;
                gap: 28px;
            }

            .hero-card .thumb {
                width: 150px;
                height: 150px;
            }

            .hero-meta {
                justify-content: flex-start;
            }

            .popular-list {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 22px;
            }

            .popular-item {
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
                gap: 14px;
            }

            .popular-item .thumb {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
                border-radius: 12px;
            }

            .popular-item .btn-secondary {
                display: none;
            }

            .popular-item:nth-child(n+3) {
                display: flex;
            }
        }

        @media (max-width: 859px) {
            .popular-item:nth-child(n+3) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Barra de Categorías agregada -->
        <nav class="nav-categories">
            <a href="#" class="category-link active">Películas</a>
            <a href="#" class="category-link">Dónde ver</a>
            <a href="#" class="category-link">Trivia</a>
        </nav>

        <section class="hero">
            <h1 class="hero-title">Reseñas</h1>
            <div class="hero-card">
                <div class="thumb">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <rect x="14" y="14" width="92" height="92" rx="10" fill="none" stroke="var(--placeholder-line)"
                            stroke-width="3" />
                        <line x1="14" y1="55" x2="106" y2="55" stroke="var(--placeholder-line)" stroke-width="3" />
                        <line x1="60" y1="55" x2="60" y2="106" stroke="var(--placeholder-line)" stroke-width="3" />
                    </svg>
                </div>
                <div class="hero-info">
                    <span class="badge">Destacada</span>
                    <h3>La Odisea</h3>
                    <div class="hero-meta">
                        <span class="rating">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 1.5l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z" />
                            </svg>
                            8.4
                        </span>
                        <button class="btn btn-primary">Reseña</button>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Populares</h2>
            <div class="popular-list">

                <div class="popular-item">
                    <div class="thumb">
                        <svg viewBox="0 0 120 120" aria-hidden="true">
                            <rect x="14" y="14" width="92" height="92" rx="10" fill="none"
                                stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="14" y1="55" x2="106" y2="55" stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="60" y1="55" x2="60" y2="106" stroke="var(--placeholder-line)" stroke-width="3" />
                        </svg>
                    </div>
                    <div class="popular-info">
                        <h4>Oppenheimer</h4>
                        <span class="rating">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 1.5l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z" />
                            </svg>
                            8.9
                        </span>
                    </div>
                    <button class="btn btn-secondary">Ver</button>
                </div>

                <div class="popular-item">
                    <div class="thumb">
                        <svg viewBox="0 0 120 120" aria-hidden="true">
                            <rect x="14" y="14" width="92" height="92" rx="10" fill="none"
                                stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="14" y1="55" x2="106" y2="55" stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="60" y1="55" x2="60" y2="106" stroke="var(--placeholder-line)" stroke-width="3" />
                        </svg>
                    </div>
                    <div class="popular-info">
                        <h4>Spiderman: Brand New Day</h4>
                        <span class="rating">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 1.5l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z" />
                            </svg>
                            8
                        </span>
                    </div>
                    <button class="btn btn-secondary">Ver</button>
                </div>

                <div class="popular-item">
                    <div class="thumb">
                        <svg viewBox="0 0 120 120" aria-hidden="true">
                            <rect x="14" y="14" width="92" height="92" rx="10" fill="none"
                                stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="14" y1="55" x2="106" y2="55" stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="60" y1="55" x2="60" y2="106" stroke="var(--placeholder-line)" stroke-width="3" />
                        </svg>
                    </div>
                    <div class="popular-info">
                        <h4>El Padrino</h4>
                        <span class="rating">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 1.5l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z" />
                            </svg>
                            9.2
                        </span>
                    </div>
                    <button class="btn btn-secondary">Ver</button>
                </div>

                <div class="popular-item">
                    <div class="thumb">
                        <svg viewBox="0 0 120 120" aria-hidden="true">
                            <rect x="14" y="14" width="92" height="92" rx="10" fill="none"
                                stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="14" y1="55" x2="106" y2="55" stroke="var(--placeholder-line)" stroke-width="3" />
                            <line x1="60" y1="55" x2="60" y2="106" stroke="var(--placeholder-line)" stroke-width="3" />
                        </svg>
                    </div>
                    <div class="popular-info">
                        <h4>Una Mente Brillante</h4>
                        <span class="rating">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 1.5l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z" />
                            </svg>
                            8.2
                        </span>
                    </div>
                    <button class="btn btn-secondary">Ver</button>
                </div>

            </div>
        </section>

    </div>

</body>

</html>
